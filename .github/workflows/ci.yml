name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# Temporarily disabled pending GitHub Actions billing flag resolution
# Remove the `if: false` line below once Actions are unblocked
jobs:
  test:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test
      - run: npm run build
